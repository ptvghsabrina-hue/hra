<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>前往健康風險評估…</title>
<script>
  const LOG = 'https://script.google.com/macros/s/AKfycby8ltg4ibCt27t1CzFrr7-FeVT7UUNyrhDs2fs-84F_koj8Jdrm6yt384rV5HsuC0HFzg/exec';
  const TARGET = 'https://cdrc.hpa.gov.tw/hra-openservice-menupage.jsp?all';

  let vid = '';
  try {
    vid = localStorage.getItem('vid') || '';
    if (!vid) { vid = Math.random().toString(36).slice(2, 10); localStorage.setItem('vid', vid); }
  } catch (e) {}

  const q = new URLSearchParams(location.search);
  const data = new URLSearchParams({
    src: q.get('src') || 'direct',
    cmp: q.get('cmp') || '',
    vid: vid,
    dev: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? '手機' : '電腦',
    ref: document.referrer
  });

  // 同一個瀏覽器、同一個來源，30 分鐘內重複開啟只記一次（重新整理、上一頁、重複點都不重算）
  const WINDOW_MS = 30 * 60 * 1000;
  const key = 'last_' + data.get('src');
  // 沒帶 ?src= 的不記錄（推廣連結都有帶 src；直接開網址多半是測試、預覽或機器人）
  let skip = !q.get('src');
  if (!skip) try {
    const last = Number(localStorage.getItem(key) || 0);
    skip = Date.now() - last < WINDOW_MS;
    if (!skip) localStorage.setItem(key, String(Date.now()));
  } catch (e) {}

  if (!skip) {
    try { fetch(LOG + '?' + data, { mode: 'no-cors', keepalive: true }); } catch (e) {}
  }
  setTimeout(function () { location.replace(TARGET); }, 300);
</script>
<style>body{font-family:system-ui,sans-serif;background:#fff;color:#222;padding:24px 16px;line-height:1.6}</style>
</head>
<body>
  <p>正在前往國健署健康風險評估頁面…<br>
  若沒有自動跳轉，請<a href="https://cdrc.hpa.gov.tw/hra-openservice-menupage.jsp?all">點此前往</a>。</p>
</body>
</html>
